<div class="bd-header__inner bd-page-width nexus-mobile-header">
  <button
    class="pst-navbar-icon sidebar-toggle primary-toggle"
    aria-label="Site navigation"
    aria-controls="pst-primary-sidebar-modal"
  >
    <span class="fa-solid fa-bars" aria-hidden="true"></span>
    <span>Navigation</span>
  </button>
  <div class="nexus-mobile-actions">
    {% include "search-button.html" %}
    {% if not remove_sidebar_secondary and secondary_sidebar_items %}
    <button
      class="pst-navbar-icon sidebar-toggle secondary-toggle"
      aria-label="On this page"
      aria-controls="pst-secondary-sidebar-modal"
    >
      <span class="fa-solid fa-list" aria-hidden="true"></span>
      <span>On this page</span>
    </button>
    {% endif %}
  </div>
</div>
