[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrain_motion_adaptation"
version = "0.1.0"
description = "Terrain-aware robot motion adaptation"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm",
]

[project.optional-dependencies]
visualization = [
    "matplotlib>=3.8",
    "pillow>=10.1",
    "trimesh>=4",
    "mjviser>=0.0.14",
    "viser>=1.0.30,<1.1",
]
dev = ["black", "ruff", "pytest"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["terrain_motion_adaptation*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
terrain_motion_adaptation = ["assets/**/*"]
